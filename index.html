<!DOCTYPE html>
<html>
<head>
<title>Nepali Typing Fight</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    color: #f0f0f0;
    text-align: center;
    margin: 0;
    padding-top: 20px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1 { font-size: 1.7em; margin-bottom: 2px; }
  p.sub { opacity: 0.7; font-size: 0.85em; margin-top: 0; }

  #hud {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 10px 0;
    font-size: 1em;
  }
  #lives { color: #e24b4a; }
  #scoreDisplay { color: #38ef7d; }

  #arena {
    position: relative;
    max-width: 650px;
    height: 200px;
    margin: 10px auto;
    border-bottom: 3px solid #444;
  }

  .stick {
    width: 60px;
    height: 140px;
    position: absolute;
    bottom: 0;
  }
  .stick .head {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 4px solid #f0f0f0;
    position: absolute;
    top: 0;
    left: 15px;
  }
  .stick .body {
    width: 4px;
    height: 45px;
    background: #f0f0f0;
    position: absolute;
    top: 30px;
    left: 28px;
  }
  .stick .armL, .stick .armR {
    width: 4px;
    height: 35px;
    background: #f0f0f0;
    position: absolute;
    top: 38px;
    left: 28px;
    transform-origin: top center;
  }
  .stick .armL { transform: rotate(35deg); }
  .stick .armR { transform: rotate(-35deg); }
  .stick .legL, .stick .legR {
    width: 4px;
    height: 40px;
    background: #f0f0f0;
    position: absolute;
    top: 75px;
    left: 28px;
    transform-origin: top center;
  }
  .stick .legL { transform: rotate(20deg); }
  .stick .legR { transform: rotate(-20deg); }

  #hero { right: 10px; }

  #enemy .head { border-color: #e24b4a; }
  #enemy .body { background: #e24b4a; }
  #enemy .armL { background: #e24b4a; }
  #enemy .armR { background: #e24b4a; }
  #enemy .legL { background: #e24b4a; }
  #enemy .legR { background: #e24b4a; }
  #enemy { left: 0px; transition: left 0.05s linear; }

  #wordBox {
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }
  .letterTile {
    background: #1e1e1e;
    border: 2px solid #f7b733;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
    transition: opacity 0.15s, transform 0.15s;
  }
  .letterTile.done {
    opacity: 0;
    transform: scale(0.3);
  }

  @keyframes punchMove {
    0%   { transform: translateX(0); }
    35%  { transform: translateX(45px); }
    100% { transform: translateX(0); }
  }
  @keyframes punchArm {
    0%   { transform: rotate(-35deg); }
    35%  { transform: rotate(-175deg); }
    100% { transform: rotate(-35deg); }
  }
  #hero.punch { animation: punchMove 0.4s ease-out; }
  #hero.punch .armR { animation: punchArm 0.4s ease-out; }

  @keyframes flyOff {
    0%   { transform: translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateX(250px) rotate(60deg); opacity: 0; }
  }
  #enemy.dead { animation: flyOff 0.4s ease-in forwards; }

  #shakeBox.shake { animation: shakeAnim 0.2s; }
  @keyframes shakeAnim {
    0% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
    100% { transform: translateX(0); }
  }

  #status { margin-top: 15px; font-size: 1.1em; min-height: 28px; }
  #keyGuide {
    margin-top: 5px;
    font-size: 0.85em;
    color: #aaa;
  }
  #keyGuide b { color: #f7b733; }
</style>
</head>
<body>

<h1>Nepali Typing Fight</h1>
<p class="sub">Preeti keyboard layout - type the keys in order before the enemy reaches you</p>

<div id="hud">
  <div id="lives">Lives: ❤️❤️❤️</div>
  <div id="scoreDisplay">Score: 0</div>
</div>

<div id="shakeBox">
<div id="arena">
  <div class="stick" id="hero">
    <div class="head"></div>
    <div class="body"></div>
    <div class="armL"></div>
    <div class="armR"></div>
    <div class="legL"></div>
    <div class="legR"></div>
  </div>
  <div class="stick" id="enemy">
    <div id="wordBox"></div>
    <div class="head"></div>
    <div class="body"></div>
    <div class="armL"></div>
    <div class="armR"></div>
    <div class="legL"></div>
    <div class="legR"></div>
  </div>
</div>
</div>

<div id="status">Get ready...</div>
<div id="keyGuide"></div>

<script>
  const letterBank = [
    { char: "क", key: "s" },
    { char: "ग", key: "u" },
    { char: "च", key: "r" },
    { char: "ज", key: "h" },
    { char: "त", key: "t" },
    { char: "द", key: "b" },
    { char: "न", key: "g" },
    { char: "प", key: "k" },
    { char: "ब", key: "a" },
    { char: "म", key: "d" },
    { char: "र", key: "/" },
    { char: "ल", key: "n" },
    { char: "स", key: ";" },
    { char: "ह", key: "x" }
  ];

  const heroX = 590;
  const enemyStartX = 0;
  const enemySpeed = 0.7;

  let currentWord = [];
  let typedIndex = 0;
  let enemyX = enemyStartX;
  let lives = 3;
  let score = 0;
  let gameOver = false;
  let paused = false;
  let animFrame = null;

  function randomWord() {
    const len = 2 + Math.floor(Math.random() * 3);
    const word = [];
    for (let i = 0; i < len; i++) {
      word.push(letterBank[Math.floor(Math.random() * letterBank.length)]);
    }
    return word;
  }

  function renderWord() {
    const box = document.getElementById('wordBox');
    box.innerHTML = '';
    currentWord.forEach((item, i) => {
      const tile = document.createElement('div');
      tile.className = 'letterTile' + (i < typedIndex ? ' done' : '');
      tile.innerText = item.char;
      box.appendChild(tile);
    });
    const guide = currentWord.map(l => l.key.toUpperCase()).join(' ');
    document.getElementById('keyGuide').innerHTML = "keys: <b>" + guide + "</b>";
  }

  function newEnemy() {
    currentWord = randomWord();
    typedIndex = 0;
    enemyX = enemyStartX;
    document.getElementById('enemy').style.left = enemyX + 'px';
    document.getElementById('enemy').classList.remove('dead');
    renderWord();
  }

  function updateLives() {
    document.getElementById('lives').innerText = 'Lives: ' + '❤️'.repeat(lives);
  }

  function shake() {
    document.getElementById('shakeBox').classList.add('shake');
    setTimeout(() => document.getElementById('shakeBox').classList.remove('shake'), 200);
  }

  function heroPunch() {
    document.getElementById('hero').classList.add('punch');
    setTimeout(() => document.getElementById('hero').classList.remove('punch'), 400);
  }

  function enemyDefeated() {
    paused = true;
    document.getElementById('enemy').classList.add('dead');
    heroPunch();
    score += 10;
    document.getElementById('scoreDisplay').innerText = 'Score: ' + score;
    document.getElementById('status').innerText = 'Defeated!';
    setTimeout(() => {
      if (gameOver) return;
      paused = false;
      newEnemy();
      document.getElementById('status').innerText = 'Fight!';
    }, 500);
  }

  function loseLife() {
    paused = true;
    lives--;
    updateLives();
    shake();
    if (lives <= 0) {
      gameOver = true;
      document.getElementById('status').innerText = 'Game Over! Final Score: ' + score;
      document.getElementById('keyGuide').innerText = '';
      return;
    }
    document.getElementById('status').innerText = 'Enemy got through!';
    setTimeout(() => {
      paused = false;
      newEnemy();
      document.getElementById('status').innerText = 'Fight!';
    }, 700);
  }

  function gameLoop() {
    if (!paused && !gameOver) {
      enemyX += enemySpeed;
      document.getElementById('enemy').style.left = enemyX + 'px';
      if (enemyX >= heroX) {
        loseLife();
      }
    }
    animFrame = requestAnimationFrame(gameLoop);
  }

  document.addEventListener('keydown', (e) => {
    if (gameOver || paused) return;
    const pressed = e.key.toLowerCase();
    const expected = currentWord[typedIndex];
    if (!expected) return;

    if (pressed === expected.key) {
      typedIndex++;
      renderWord();
      if (typedIndex >= currentWord.length) {
        enemyDefeated();
      }
    } else {
      shake();
    }
  });

  updateLives();
  newEnemy();
  document.getElementById('status').innerText = 'Fight!';
  gameLoop();
</script>

</body>
</html>
