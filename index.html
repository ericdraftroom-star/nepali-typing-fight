<!DOCTYPE html>
<html>
<head>
<title>Nepali Typing Fight</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    color: #f0f0f0;
    text-align: center;
    margin: 0;
    padding-top: 30px;
    min-height: 100vh;
  }
  h1 { font-size: 1.8em; margin-bottom: 5px; }
  p.sub { opacity: 0.7; font-size: 0.9em; margin-top: 0; }

  .bars { max-width: 500px; margin: 20px auto; }
  .barBox {
    background: #333;
    border-radius: 10px;
    height: 16px;
    width: 100%;
    overflow: hidden;
  }
  .barFill {
    height: 100%;
    background: #38ef7d;
    width: 100%;
    transition: width 0.2s;
  }

  #arena {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    max-width: 600px;
    height: 180px;
    margin: 20px auto;
    padding: 0 60px;
  }

  .stick {
    width: 60px;
    height: 140px;
    position: relative;
    transition: transform 0.15s;
  }
  .stick .head {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 4px solid #f0f0f0;
    position: absolute;
    top: 0;
    left: 15px;
  }
  .stick .body {
    width: 4px;
    height: 45px;
    background: #f0f0f0;
    position: absolute;
    top: 30px;
    left: 28px;
  }
  .stick .armL, .stick .armR {
    width: 4px;
    height: 35px;
    background: #f0f0f0;
    position: absolute;
    top: 38px;
    transform-origin: top center;
  }
  .stick .armL { left: 28px; transform: rotate(35deg); }
  .stick .armR { left: 28px; transform: rotate(-35deg); }
  .stick .legL, .stick .legR {
    width: 4px;
    height: 40px;
    background: #f0f0f0;
    position: absolute;
    top: 75px;
    transform-origin: top center;
  }
  .stick .legL { left: 28px; transform: rotate(20deg); }
  .stick .legR { left: 28px; transform: rotate(-20deg); }

  #enemyStick .head, #enemyStick .body, #enemyStick .armL, #enemyStick .armR {
    border-color: #e24b4a;
    background: #e24b4a;
  }

  #player.punch { transform: translateX(20px); }
  #player.punch .armR { transform: rotate(-100deg); }
  #enemy.hit { transform: translateX(-15px); }
  #enemy.hit .head { filter: brightness(2); }

  #challengeBox {
    margin: 25px auto;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: #1e1e1e;
    border: 2px solid #f7b733;
    border-radius: 20px;
    padding: 18px 30px;
  }
  #challenge {
    font-size: 3em;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 15px #f7b733;
  }
  #keyHint {
    font-size: 0.85em;
    color: #aaa;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 4px 10px;
  }
  #keyHint b { color: #f7b733; }

  #shakeBox.shake { animation: shakeAnim 0.2s; }
  @keyframes shakeAnim {
    0% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
    100% { transform: translateX(0); }
  }

  #status { margin-top: 10px; font-size: 1.1em; min-height: 28px; }
  #score { margin-top: 5px; opacity: 0.7; font-size: 0.9em; }
</style>
</head>
<body>

<h1>Nepali Typing Fight</h1>
<p class="sub">Preeti keyboard layout - press the key shown to punch</p>

<div class="bars">
  <div class="barBox"><div class="barFill" id="enemyBar"></div></div>
</div>

<div id="arena">
  <div class="stick" id="player">
    <div class="head"></div>
    <div class="body"></div>
    <div class="armL"></div>
    <div class="armR"></div>
    <div class="legL"></div>
    <div class="legR"></div>
  </div>
  <div class="stick" id="enemy">
    <div class="head"></div>
    <div class="body"></div>
    <div class="armL"></div>
    <div class="armR"></div>
    <div class="legL"></div>
    <div class="legR"></div>
  </div>
</div>

<div id="shakeBox">
  <div id="challengeBox">
    <div id="challenge">क</div>
    <div id="keyHint">key: <b>S</b></div>
  </div>
</div>

<div id="status">Get ready...</div>
<div id="score">Score: 0</div>

<script>
  const letters = [
    { char: "क", key: "s" },
    { char: "ग", key: "u" },
    { char: "च", key: "r" },
    { char: "ज", key: "h" },
    { char: "त", key: "t" },
    { char: "द", key: "b" },
    { char: "न", key: "g" },
    { char: "प", key: "k" },
    { char: "ब", key: "a" },
    { char: "म", key: "d" },
    { char: "र", key: "/" },
    { char: "ल", key: "n" },
    { char: "स", key: ";" },
    { char: "ह", key: "x" }
  ];

  let current = null;
  let score = 0;
  let enemyHealth = 100;
  const damagePerHit = 10;

  function newChallenge() {
    current = letters[Math.floor(Math.random() * letters.length)];
    document.getElementById('challenge').innerText = current.char;
    document.getElementById('keyHint').innerHTML = "key: <b>" + current.key.toUpperCase() + "</b>";
  }

  function punch() {
    document.getElementById('player').classList.add('punch');
    document.getElementById('enemy').classList.add('hit');
    setTimeout(() => {
      document.getElementById('player').classList.remove('punch');
      document.getElementById('enemy').classList.remove('hit');
    }, 150);
  }

  function shake() {
    document.getElementById('shakeBox').classList.add('shake');
    setTimeout(() => document.getElementById('shakeBox').classList.remove('shake'), 200);
  }

  function updateHealthBar() {
    document.getElementById('enemyBar').style.width = enemyHealth + "%";
  }

  document.addEventListener('keydown', (e) => {
    if (!current) return;
    const pressed = e.key.toLowerCase();

    if (pressed === current.key) {
      punch();
      score++;
      enemyHealth -= damagePerHit;
      document.getElementById('score').innerText = "Score: " + score;
      document.getElementById('status').innerText = "Hit!";

      if (enemyHealth <= 0) {
        enemyHealth = 0;
        updateHealthBar();
        document.getElementById('status').innerText = "You defeated the enemy! Final Score: " + score;
        document.getElementById('challenge').innerText = "WIN";
        document.getElementById('keyHint').innerText = "";
        current = null;
        return;
      }
      updateHealthBar();
      newChallenge();
    } else {
      shake();
      document.getElementById('status').innerText = "Wrong key, try again";
    }
  });

  newChallenge();
  updateHealthBar();
  document.getElementById('status').innerText = "Fight!";
</script>

</body>
</html>
